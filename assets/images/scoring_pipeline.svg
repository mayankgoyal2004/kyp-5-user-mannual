<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#stepBg)"/>

  <text x="450" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#f8fafc">KYP 5 Psychometric Assessment &amp; Scoring Pipeline</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">How Student Choices Translate into Normalized Career Stream Dispatches</text>

  <!-- Step 1: Student Answers -->
  <g transform="translate(30, 90)" filter="url(#boxShadow)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="35" r="18" fill="#4f46e5"/>
    <text x="70" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff">1</text>
    <text x="70" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Student Choice</text>
    <text x="70" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Selected Options</text>
    <text x="70" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Likert / MCQs</text>
    <rect x="20" y="140" width="100" height="24" rx="4" fill="#334155"/>
    <text x="70" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38bdf8">UserAnswer DB</text>
  </g>

  <!-- Step 2: Hidden Option Weights -->
  <g transform="translate(210, 90)" filter="url(#boxShadow)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="35" r="18" fill="#0284c7"/>
    <text x="70" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff">2</text>
    <text x="70" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Option Weights</text>
    <text x="70" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Multi-Group Map</text>
    <text x="70" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">+10 Science</text>
    <rect x="20" y="140" width="100" height="24" rx="4" fill="#334155"/>
    <text x="70" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38bdf8">+5 Engineering</text>
  </g>

  <!-- Step 3: Raw Accumulation -->
  <g transform="translate(390, 90)" filter="url(#boxShadow)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="35" r="18" fill="#059669"/>
    <text x="70" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff">3</text>
    <text x="70" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Raw Summation</text>
    <text x="70" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Totals per Group</text>
    <text x="70" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">&amp; Sub-Groups</text>
    <rect x="20" y="140" width="100" height="24" rx="4" fill="#334155"/>
    <text x="70" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">Raw Score Sum</text>
  </g>

  <!-- Step 4: Normalization -->
  <g transform="translate(570, 90)" filter="url(#boxShadow)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="35" r="18" fill="#d97706"/>
    <text x="70" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff">4</text>
    <text x="70" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Normalization</text>
    <text x="70" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Score % per Group</text>
    <text x="70" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Ranking Profiles</text>
    <rect x="20" y="140" width="100" height="24" rx="4" fill="#334155"/>
    <text x="70" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#fbbf24">Primary/Sec/Tert</text>
  </g>

  <!-- Step 5: PDF Engine -->
  <g transform="translate(740, 90)" filter="url(#boxShadow)">
    <rect width="130" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="65" cy="35" r="18" fill="url(#purpleGrad)"/>
    <text x="65" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff">5</text>
    <text x="65" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">PDF Generation</text>
    <text x="65" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Puppeteer Worker</text>
    <text x="65" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Handlebars Template</text>
    <rect x="15" y="140" width="100" height="24" rx="4" fill="#334155"/>
    <text x="65" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#c084fc">Branded Career PDF</text>
  </g>

  <!-- Arrows -->
  <path d="M170 180 L210 180" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <path d="M350 180 L390 180" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M530 180 L570 180" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M710 180 L740 180" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
</svg>
